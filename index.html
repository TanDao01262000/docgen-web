// Optional local overrides (gitignored). Fetch so a missing file does not spam console 404 on Pages.
fetch('config.local.js',{cache:'no-store'}).then(r=>r.ok?r.text():'').then(txt=>{
  if(!txt) return;
  const s=document.createElement('script'); s.textContent=txt; document.head.appendChild(s);

body{font-family:system-ui,sans-serif;max-width:980px;margin:24px auto;padding:0 16px;background:#f6f7fb;color:#222}

<div class="card" style="padding:10px 22px">
<label class="t"><input type="radio" name="mode" value="generic" onchange="setMode(this.value)"> <span data-i="mode_g">Chế độ chung</span></label>
<label class="t"><input type="radio" name="mode" value="voucher" checked onchange="setMode(this.value)"> <span data-i="mode_v">Chế độ Voucher (file tổng hợp → 2 voucher)</span></label>

</div>

<input type="file" id="vfile" accept=".xlsx,.xls"> <button id="vexbtn" onclick="vExtract()" data-i="vextract">Đọc &amp; xem trước</button>

<button class="sec" onclick="vExportHotels()" data-i="vexphotels">Xuất danh sách KS</button>
<button class="sec" onclick="document.getElementById('vimp').click()" data-i="vimphotels">Nhập danh sách KS</button>
<input type="file" id="vimp" accept=".json" style="display:none" onchange="vImportHotels(event)"></p>
</div>

<input type="password" id="key" placeholder="API key / Khóa API" size="40"> <label class="muted"><input type="checkbox" id="ocrv" checked> <span data-i="ocrv"></span></label> <button class="sec" onclick="saveSet()" data-i="save"></button></details>
<script>

const I={vi:{sub:'Tải lên file Excel/PDF → kiểm tra thông tin → tạo văn bản Word. Mọi xử lý đều diễn ra ngay trên trình duyệt; tệp của bạn không được gửi đi đâu (trừ khi bạn bật AI bằng khóa riêng).',
s1:'1. Chọn mẫu văn bản',addtpl:'Thêm mẫu mới (file .docx có chỗ điền như {{customer_name}}, được lưu trên trình duyệt này):',s2:'2. Tải lên file dữ liệu',extract:'Đọc dữ liệu',
s3:'3. Kiểm tra & chỉnh sửa',s3d:'Mỗi dòng tương ứng một bộ văn bản. Bạn có thể sửa trực tiếp từng ô.',addrow:'+ Thêm dòng',gen:'Tạo & tải văn bản',txt:'Nội dung đã đọc được',
set:'⚙️ Cài đặt (AI – không bắt buộc)',setd:'Lấy khóa miễn phí tại console.groq.com hoặc aistudio.google.com. Khóa chỉ được lưu trên trình duyệt này và dùng khi đọc file PDF.',

ocr:'Đang nhận dạng chữ trang %i/%n (lần đầu cần tải dữ liệu ngôn ngữ, vui lòng chờ)...',aifail:'AI gặp lỗi: ',pick:'Vui lòng chọn một file.',extracting:'Đang đọc dữ liệu, vui lòng chờ...',
badfile:'Vui lòng tải lên file .xlsx, .xls, .csv hoặc .pdf',err:'Đã xảy ra lỗi: ',done:'Đã đọc %r dòng dữ liệu. Cách đọc: %m. Số trang nhận dạng chữ (OCR): %o.',rules:'theo quy tắc',
nothing:'Chưa có gì để tạo. Vui lòng chọn mẫu và nhập dữ liệu.',saved:'Đã lưu trên trình duyệt này.',zip:'van-ban.zip',lang:'English'},
en:{sub:'Upload Excel/PDF → review fields → generate Word documents. Everything runs in your browser; files never leave this computer (except to your AI provider if you add a key).',

s3:'3. Review & edit',s3d:'One row = one set of documents. Edit any cell.',addrow:'+ Row',gen:'Generate & download',txt:'Extracted text',

badfile:'Upload .xlsx, .xls, .csv or .pdf',err:'Error: ',done:'%r record(s). Method: %m. OCR pages: %o.',rules:'rules',
nothing:'Nothing to generate.',saved:'Saved in this browser.',zip:'documents.zip',lang:'Tiếng Việt'}};

I.vi.mode_g='Chế độ chung';I.en.mode_g='Generic mode';
I.vi.mode_v='Chế độ Voucher (file tổng hợp → 2 voucher)';I.en.mode_v='Voucher mode (summary → 2 vouchers)';
I.vi.v1='1. Tải file tổng hợp (.xlsx)';I.en.v1='1. Upload summary (.xlsx)';
I.vi.vextract='Đọc & xem trước';I.en.vextract='Parse & preview';
I.vi.v2='2. Kiểm tra & chỉnh sửa';I.en.v2='2. Review & edit';
I.vi.v2d='Ô thiếu thông tin được tô vàng. Sửa trước khi tạo file.';I.en.v2d='Missing fields are highlighted. Edit before generating.';
I.vi.vguests='Danh sách khách (mỗi dòng một người)';I.en.vguests='Guest list (one per line)';
I.vi.vacc='Khách sạn / tàu';I.en.vacc='Hotels / train';
I.vi.vtrf='Transfers / tours';I.en.vtrf='Transfers / tours';
I.vi.vgen='Tạo 2 voucher & tải về';I.en.vgen='Generate 2 vouchers & download';
I.vi.vneedparse='Chưa có dữ liệu để tạo voucher. Vui lòng chọn file tổng hợp và bấm "Đọc & xem trước" trước.';I.en.vneedparse='Nothing to generate yet. Please upload the summary file and click Parse & preview first.';
I.vi.vexphotels='Xuất danh sách KS';I.en.vexphotels='Export hotel list';
I.vi.vimphotels='Nhập danh sách KS';I.en.vimphotels='Import hotel list';

let LANG=localStorage.lang||'vi';const t=k=>I[LANG][k];
function setLang(l){LANG=l;localStorage.lang=l;document.documentElement.lang=l;document.querySelectorAll('[data-i]').forEach(e=>e.textContent=t(e.dataset.i));langbtn.textContent=t('lang');if(window.T&&Object.keys(T).length)loadT()}
pdfjsLib.GlobalWorkerOptions.workerSrc='vendor/pdf.worker.min.js';
let T={},fields=[],records=[{}];
const norm=s=>String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D').trim().toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'');
// ---- IndexedDB for user templates
const db=new Promise(r=>{const q=indexedDB.open('docgen',1);q.onupgradeneeded=()=>q.result.createObjectStore('tpl');q.onsuccess=()=>r(q.result)});
async function idb(mode,fn){const d=await db;return new Promise((res,rej)=>{const s=d.transaction('tpl',mode).objectStore('tpl');const q=fn(s);q.onsuccess=()=>res(q.result);q.onerror=rej})}
function tplFields(buf){const doc=new docxtemplater(new PizZip(buf),{paragraphLoop:true,linebreaks:true,delimiters:{start:'{{',end:'}}'}});
 return [...new Set([...doc.getFullText().matchAll(/\{\{\s*([\w.]+)\s*\}\}/g)].map(m=>m[1]))].sort()}
async function loadT(){T={};
 for(const n of await (await fetch('templates/index.json')).json()){const b=await (await fetch('templates/'+n)).arrayBuffer();T[n]={buf:b,fields:tplFields(b),builtin:1}}
 const keys=await idb('readonly',s=>s.getAllKeys());for(const k of keys){const b=await idb('readonly',s=>s.get(k));try{T[k]={buf:b,fields:tplFields(b)}}catch(e){}}
 tpls.innerHTML=Object.entries(T).map(([n,x])=>`<label class="t"><input type="checkbox" value="${n}" checked onchange="refields()"> <b>${n}</b> ${x.builtin?'<span class="muted">('+t('ex')+')</span>':`<a href="#" class="muted" onclick="delT('${n}');return false">'+t('del')+'</a>`} <span class="muted">${x.fields.join(', ')}</span></label>`).join('');refields()}
const sel=()=>[...document.querySelectorAll('#tpls input:checked')].map(i=>i.value);
function refields(){fields=[...new Set(sel().flatMap(n=>T[n].fields))].sort();draw()}
async function delT(n){if(confirm(t('delq')+' '+n+'?')){await idb('readwrite',s=>s.delete(n));loadT()}}
tplfile.onchange=async()=>{const f=tplfile.files[0],b=await f.arrayBuffer();try{tplFields(b)}catch(e){alert(t('badtpl')+e.message);return}
 await idb('readwrite',s=>s.put(b,f.name));tplfile.value='';loadT()};
// ---- extraction
async function readPdf(buf){const pdf=await pdfjsLib.getDocument({data:buf}).promise;let out=[],ocr=0;
 for(let i=1;i<=pdf.numPages;i++){const p=await pdf.getPage(i);const tc=await p.getTextContent();
  let lines={};tc.items.forEach(it=>{const y=Math.round(it.transform[5]);(lines[y]=lines[y]||[]).push(it.str)});
  let tx=Object.keys(lines).sort((a,b)=>b-a).map(y=>lines[y].join(' ')).join('\n').trim();
  if(tx.length<20){info.textContent=t('ocr').replace('%i',i).replace('%n',pdf.numPages);
   const vp=p.getViewport({scale:2.5}),c=document.createElement('canvas');c.width=vp.width;c.height=vp.height;
   await p.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;
   const r=await Tesseract.recognize(c,ocrv.checked?'vie+eng':'eng');tx=r.data.text;ocr++}
  out.push(tx)}return {text:out.join('\n'),ocr}}
function ruleKV(text){const kv={};text.split('\n').forEach(l=>{const m=l.match(/^\s*([^:]{2,40}):\s*(.+)/);if(m&&!(norm(m[1]) in kv))kv[norm(m[1])]=m[2].trim()});return kv}
async function ai(text){const p=localStorage.prov,k=localStorage.key;if(!p||!k||!fields.length)return null;
 const prompt=`Extract these fields from the document and return ONLY a JSON object with exactly these keys (empty string if unknown): ${JSON.stringify(fields)}\n\nDOCUMENT:\n${text.slice(0,12000)}`;
 try{if(p=='groq'){const r=await fetch('https://api.groq.com/openai/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+k},
   body:JSON.stringify({model:'llama-3.3-70b-versatile',response_format:{type:'json_object'},messages:[{role:'user',content:prompt}]})});return JSON.parse((await r.json()).choices[0].message.content)}
  const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key='+encodeURIComponent(k),{method:'POST',headers:{'Content-Type':'application/json'},
   body:JSON.stringify({contents:[{parts:[{text:prompt}]}],generationConfig:{responseMimeType:'application/json'}})});return JSON.parse((await r.json()).candidates[0].content.parts[0].text)}
 catch(e){console.warn(e);info.textContent+=' ('+t('aifail')+e.message+')';return null}}
async function extract(){const f=data.files[0];if(!f)return alert(t('pick'));info.textContent=t('extracting');
 const buf=await f.arrayBuffer(),n=f.name.toLowerCase();let text='',ocr=0,method='rules';
 try{if(/\.(xlsx|xls|csv)$/.test(n)){const wb=XLSX.read(buf);const ws=wb.Sheets[wb.SheetNames[0]];
   records=XLSX.utils.sheet_to_json(ws,{defval:'',raw:false}).map(r=>Object.fromEntries(Object.entries(r).map(([k,v])=>[norm(k),String(v)])));text=XLSX.utils.sheet_to_csv(ws)}
  else if(n.endsWith('.pdf')){({text,ocr}=await readPdf(buf));let r=ruleKV(text);const a=await ai(text);
   if(a){method=localStorage.prov;for(const[k,v]of Object.entries(a))if(v)r[k]=String(v)}records=[r]}
  else return info.textContent=t('badfile');}catch(e){info.textContent=t('err')+e.message;return}
 if(!records.length)records=[{}];txt.textContent=text.slice(0,5000);
 info.textContent=t('done').replace('%r',records.length).replace('%m',method=='rules'?t('rules'):method).replace('%o',ocr);draw()}
function draw(){grid.innerHTML='<table><tr><th>STT</th>'+fields.map(f=>`<th>${f}</th>`).join('')+'<th></th></tr>'+records.map((r,i)=>`<tr><td>${i+1}</td>`+fields.map(f=>`<td><input value="${String(r[f]??'').replace(/"/g,'&quot;')}" oninput="records[${i}]['${f}']=this.value"></td>`).join('')+`<td><a href="#" onclick="records.splice(${i},1);draw();return false">✕</a></td></tr>`).join('')+'</table>'}
function addRow(){records.push({});draw()}
function dl(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove()}
const MIME='application/vnd.openxmlformats-officedocument.wordprocessingml.document';
async function gen(){const files=[];
 records.forEach((rec,i)=>sel().forEach(n=>{const d=new docxtemplater(new PizZip(T[n].buf),{paragraphLoop:true,linebreaks:true,delimiters:{start:'{{',end:'}}'},nullGetter:()=>'',parser:t=>({get:s=>t.trim()==='.'?s:s[t.trim()]})});
  d.render(rec);const tag=norm(rec.customer_name||rec.name||'')||'row'+(i+1);files.push([n.replace(/\.docx$/,'')+'_'+tag+'.docx',d.getZip().generate({type:'blob',mimeType:MIME,compression:'DEFLATE'})])}));
 if(!files.length)return alert(t('nothing'));if(files.length==1)return dl(files[0][1],files[0][0]);
 const z=new JSZip();files.forEach(([n,b])=>z.file(n,b));dl(await z.generateAsync({type:'blob'}),t('zip'))}
function saveSet(){localStorage.prov=prov.value;localStorage.key=key.value;alert(t('saved'))}
prov.value=localStorage.prov||'';key.value=localStorage.key||'';

let VDATA=null, VHOTELS=[];
function setMode(m){modeGeneric.style.display=m==='generic'?'block':'none';modeVoucher.style.display=m==='voucher'?'block':'none'}
function voucherReady(){
  return !!(VDATA && Array.isArray(VDATA.acc_rows) && Array.isArray(VDATA.trf_rows));
}
function persistVoucher(){
  try{ sessionStorage.setItem('docgen_voucher', JSON.stringify(VDATA)); }catch(e){}
}
function restoreVoucher(){
  try{
    const raw=sessionStorage.getItem('docgen_voucher');
    if(!raw) return false;
    VDATA=JSON.parse(raw);
    if(!voucherReady()) { VDATA=null; return false; }
    v_update.value=VDATA.update_date||''; v_pax.value=VDATA.pax||''; v_contact.value=VDATA.contact||'';
    v_guests.value=(VDATA.guests||[]).join('\n');
    vinfo.textContent=(LANG==='vi'?`Đã khôi phục: ${VDATA.acc_rows.length} dòng KS/tàu, ${VDATA.trf_rows.length} transfer/tour.`:`Restored parsed voucher data.`);
    drawVacc(); drawVtrf();
    return true;
  }catch(e){ VDATA=null; return false; }
}
async function vExtract(){
  const f=vfile.files[0]; if(!f) return alert(t('pick'));
  vinfo.textContent=t('extracting');
  try{
    VHOTELS=await Voucher.loadHotels();
    const buf=await f.arrayBuffer();
    const wb=XLSX.read(buf);
    VDATA=Voucher.parseSummary(wb, VHOTELS);
    const need=VDATA.acc_rows.filter(r=>r.is_hotel&&r.missing);
    if(need.length){ vinfo.textContent=(LANG==='vi'?'Đang tra cứu khách sạn còn thiếu...':'Looking up missing hotels...'); await Voucher.enrichMissingHotels(VDATA, VHOTELS); }
    persistVoucher();
    vinfo.textContent=(LANG==='vi'?`Đã đọc: ${VDATA.acc_rows.length} dòng KS/tàu, ${VDATA.trf_rows.length} transfer/tour. (có thể tạo voucher ngay)`:`Parsed: ${VDATA.acc_rows.length} hotel/train rows, ${VDATA.trf_rows.length} transfers.`);
    vflags.innerHTML=VDATA.flags.map(x=>{
      const ai=x.level==='ai'||/AI tạo|không chính xác/i.test(x.msg);
      const bg=ai?'#fee2e2':'#fef3c7'; const border=ai?'border:1px solid #ef4444':'';
      return `<div style="background:${bg};padding:8px;margin:4px 0;border-radius:6px;${border}">${x.msg}</div>`;
    }).join('');
    if(VDATA.acc_rows.some(r=>String(r.source||'').startsWith('gemini'))){
      vflags.innerHTML = `<div style="background:#ffedd5;border:2px solid #f97316;padding:10px;margin:6px 0;border-radius:8px;font-weight:600">⚠ Có địa chỉ do AI tạo trong voucher — vui lòng kiểm tra kỹ trước khi tải file.</div>` + vflags.innerHTML;
    }
    v_update.value=VDATA.update_date; v_pax.value=VDATA.pax; v_contact.value=VDATA.contact; v_guests.value=VDATA.guests.join('\n');
    drawVacc(); drawVtrf();
  }catch(e){
    console.error(e);
    VDATA=null;
    try{ sessionStorage.removeItem('docgen_voucher'); }catch(_){}
    vinfo.textContent=(LANG==='vi'?'Lỗi đọc file: ':'Error: ')+(e.message||e);
    alert(vinfo.textContent);
  }
}
function drawVacc(){
  const rows=VDATA.acc_rows;
  vacc.innerHTML='<div class="scrollx"><table><tr><th>STT</th><th>Loại</th><th>City / Train</th><th>Check-in</th><th>Check-out</th><th>Hotel block</th><th>Note</th></tr>'+
    rows.map((r,i)=>{
      const bg=r.missing?'background:#fef08a':'';
      if(r.is_train) return `<tr style="${bg}"><td>${i+1}</td><td>train</td><td colspan="5"><textarea rows="2" style="width:100%" oninput="VDATA.acc_rows[${i}].train_text=this.value">${(r.train_text||'').replace(/</g,'&lt;')}</textarea></td></tr>`;
      return `<tr style="${bg}"><td>${i+1}</td><td>hotel</td>
        <td><input value="${r.city||''}" oninput="VDATA.acc_rows[${i}].city=this.value"></td>
        <td><input value="${(r.check_in||'').replace(/"/g,'&quot;')}" oninput="VDATA.acc_rows[${i}].check_in=this.value"></td>
        <td><textarea rows="2" oninput="VDATA.acc_rows[${i}].check_out=this.value">${r.check_out||''}</textarea></td>
        <td><textarea rows="3" oninput="VDATA.acc_rows[${i}].hotel_block=this.value;VDATA.acc_rows[${i}].missing=false">${r.hotel_block||''}</textarea>
          ${r.source==='serper'?`<div class="muted">Từ tìm kiếm Google (Serper)</div>`:r.source==='tavily'?`<div class="muted">Từ tìm kiếm web (Tavily)</div>`:String(r.source||'').startsWith('gemini')?`<div style="color:#b91c1c;font-weight:600">⚠ Địa chỉ do AI tạo, có thể không chính xác – vui lòng kiểm tra trước khi tải</div>`:r.auto_lookup?`<div class="muted">tra cứu tự động – vui lòng kiểm tra</div>`:''}${r.missing?`<button class="sec" onclick="vSaveHotel(${i})">Lưu KS này</button>`:''}</td>
        <td><textarea rows="3" oninput="VDATA.acc_rows[${i}].note=this.value">${r.note||''}</textarea></td></tr>`;
    }).join('')+'</table></div>';
}
function drawVtrf(){
  const rows=VDATA.trf_rows;
  vtrf.innerHTML='<div class="scrollx"><table><tr><th>STT</th><th>Label</th><th>Date</th><th>From</th><th>To</th><th>Note</th></tr>'+
    rows.map((r,i)=>`<tr style="${r.missing?'background:#fef08a':''}"><td>${i+1}</td>
      <td><textarea rows="2" oninput="VDATA.trf_rows[${i}].label=this.value">${r.label||''}</textarea></td>
      <td><input value="${r.date||''}" oninput="VDATA.trf_rows[${i}].date=this.value"></td>
      <td><textarea rows="3" oninput="VDATA.trf_rows[${i}].where_from=this.value">${r.where_from||''}</textarea></td>
      <td><textarea rows="3" oninput="VDATA.trf_rows[${i}].where_to=this.value">${r.where_to||''}</textarea></td>
      <td><textarea rows="4" oninput="VDATA.trf_rows[${i}].note=this.value">${r.note||''}</textarea></td></tr>`).join('')+'</table></div>';
}
function vSaveHotel(i){
  const r=VDATA.acc_rows[i];
  const lines=(r.hotel_block||'').split('\n').map(s=>s.trim()).filter(Boolean);
  const h={id:'custom-'+Date.now(), aliases:[r.hotel_name||lines[0], r.city], name:lines[0]||r.hotel_name,
    address:lines.filter(l=>!/^tel|^web|^telefon/i.test(l)).slice(1).join(', '),
    phone:(lines.find(l=>/^tel|^telefon/i.test(l))||'').replace(/^Tel(efon)?\s*:\s*/i,''),
    website:(lines.find(l=>/^web/i.test(l))||'').replace(/^Web\s*:\s*/i,'')};
  Voucher.saveHotelExtra(h); r.missing=false; alert(t('saved')); drawVacc();
}
function vExportHotels(){
  const extra=localStorage.hotelDir||'[]';
  const blob=new Blob([extra],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='hotels-extra.json'; a.click();
}
async function vImportHotels(ev){
  const f=ev.target.files[0]; if(!f) return;
  const arr=JSON.parse(await f.text());
  localStorage.hotelDir=JSON.stringify(arr); alert(t('saved'));
}
async function vGen(){
  // Never re-check the file input — use parsed data only
  if(!voucherReady()){
    restoreVoucher();
  }
  if(!voucherReady()) return alert(t('vneedparse')||t('pick'));
  try{
    VDATA.update_date=v_update.value; VDATA.pax=v_pax.value; VDATA.contact=v_contact.value;
    VDATA.guests=v_guests.value.split('\n').map(s=>s.trim()).filter(Boolean);
    VDATA.guest_lines=VDATA.guests.join('\n');
    VDATA.acc_rows=VDATA.acc_rows.map((r,i,arr)=>{
      const is_train=!!r.is_train;
      const is_hotel=!!r.is_hotel && !is_train;
      const prevTrain=i>0 && !!arr[i-1].is_train;
      return {...r, is_train, is_hotel, show_header: is_hotel && !prevTrain};
    });
    // Flatten to one table-row per entry for docxtemplater (header/data/train)
    VDATA.acc_print_rows=[];
    for(const r of VDATA.acc_rows){
      if(r.is_train){
        VDATA.acc_print_rows.push({is_hdr:false, is_data:false, is_train:true, train_text:r.train_text||''});
      } else if(r.is_hotel){
        if(r.show_header){
          VDATA.acc_print_rows.push({is_hdr:true, is_data:false, is_train:false});
        }
        VDATA.acc_print_rows.push({
          is_hdr:false, is_data:true, is_train:false,
          city:r.city||'', check_in:r.check_in||'', check_out:r.check_out||'',
          hotel_block:r.hotel_block||'', note:r.note||''
        });
      }
    }
    VDATA.trf_print_rows=[];
    for(const r of (VDATA.trf_rows||[])){
      VDATA.trf_print_rows.push({is_hdr:true, is_data:false});
      VDATA.trf_print_rows.push({
        is_hdr:false, is_data:true,
        label:r.label||'', date:r.date||'', where_from:r.where_from||'',
        where_to:r.where_to||'', note:r.note||''
      });
    }
    if(!VDATA.payment) VDATA.payment='ALL FULLY PREPAID BY CK GO2';
    if(!VDATA.meal) VDATA.meal='Breakfast';
    persistVoucher();
    vinfo.textContent=(LANG==='vi'?'Đang tạo file Word...':'Generating Word files...');
    const a=await Voucher.renderVoucherDoc('voucher_accommodation.docx', VDATA);
    const b=await Voucher.renderVoucherDoc('voucher_transfers.docx', VDATA);
    const z=new JSZip(); z.file('VOUCHER-ACCOMMODATION.docx',a); z.file('VOUCHER-TRANSFERS.docx',b);
    const blob=await z.generateAsync({type:'blob'});
    const link=document.createElement('a'); link.href=URL.createObjectURL(blob); link.download='vouchers.zip'; link.click();
    vinfo.textContent=(LANG==='vi'?'Đã tạo vouchers.zip':'Downloaded vouchers.zip');
  }catch(e){
    console.error(e);
    alert((LANG==='vi'?'Lỗi khi tạo voucher: ':'Generate error: ')+(e.message||e));
  }
}
setMode('voucher');
restoreVoucher();

setLang(LANG);loadT();
</script></body></html>
